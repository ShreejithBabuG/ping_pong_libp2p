[package]
name = "meerkat-wasm-client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
meerkat-protocol = { path = "../shared" }

libp2p = { version = "0.56", default-features = false, features = [
    "macros",
    "wasm-bindgen",
    "websocket-websys",
    "noise",
    "yamux"
] }

libp2p-stream = "0.4.0-alpha"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
js-sys = "0.3"

futures = "0.3"
serde_json = "1"
anyhow = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
console_error_panic_hook = "0.1"