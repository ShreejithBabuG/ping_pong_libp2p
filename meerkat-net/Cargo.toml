[package]
name = "meerkat-net"
version = "0.1.0"
edition = "2021"

[dependencies]
libp2p = { version = "0.56", features = ["tokio", "tcp", "dns", "websocket", "noise", "yamux"] }
libp2p-stream = "0.4.0-alpha"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
rand = "0.8"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
